name: Vérifier le client vocal public

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Syntaxe et isolation du frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraire le JavaScript et contrôler les références
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf8")
          js = html.split("<script>", 1)[1].split("</script>", 1)[0]
          assert "const BASE_URL=" in js
          assert "BidiGenerateContentConstrained" in js
          assert "angel-live-token" in js
          assert "dchunxngtdbtgxbccmlb" in html
          metier = Path("metier.js").read_text(encoding="utf8")
          preview = Path("transcript-preview.js").read_text(encoding="utf8")
          archives = Path("archive.js").read_text(encoding="utf8")
          memory = Path("memory.js").read_text(encoding="utf8")
          for forbidden in ["hjrmkkybhhwfelmatcga", "GEMINI_API_KEY", "SUPABASE_SERVICE_ROLE_KEY", "sb_secret_", "AIza"]:
              assert forbidden not in html and forbidden not in metier and forbidden not in preview and forbidden not in archives and forbidden not in memory, "Référence interdite détectée"
          assert '<script src="./metier.js"></script>' in html
          assert '<script src="./transcript-preview.js"></script>' in html
          assert '<script src="./archive.js"></script>' in html
          assert '<script src="./memory.js"></script>' in html
          assert 'memories.context()' in html
          assert 'angel-live-memory' in memory
          assert "const archiveReady=await archives.show()" in html
          assert "if(!archives.isReady())" in html
          assert "resolution=ignore-duplicates" in archives
          assert "Reprendre la dernière conversation" in archives
          assert "Reprendre cette conversation" in archives
          assert "angel-open-archives" in archives
          assert "details.open=true" in archives
          assert "afficher_conversations" in metier
          assert "openPicker()" in metier
          assert 'transcripts.turnComplete()' in html
          assert 'tools:[{functionDeclarations:metier.toolDefs}]' in html
          assert 'metier.toolCall(data.toolCall.functionCalls)' in html
          assert "confirmer_devis" not in metier.split("const toolDefs=", 1)[1].split("const viewCSS=", 1)[0]
          assert len(js) > 2500
          Path("/tmp/angel-v2-client.js").write_text(js, encoding="utf8")
          PY
      - name: Vérifier les cinq scripts JavaScript
        run: |
          node --check /tmp/angel-v2-client.js
          node --check metier.js
          node --check transcript-preview.js
          node --check archive.js
          node --check memory.js
