name: Vérifier le client vocal public

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Syntaxe et isolation du frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraire le JavaScript et contrôler les références
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf8")
          js = html.split("<script>", 1)[1].split("</script>", 1)[0]
          assert "const BASE_URL=" in js
          assert "BidiGenerateContentConstrained" in js
          assert "angel-live-token" in js
          assert "dchunxngtdbtgxbccmlb" in html
          metier = Path("metier.js").read_text(encoding="utf8")
          preview = Path("transcript-preview.js").read_text(encoding="utf8")
          archives = Path("archive.js").read_text(encoding="utf8")
          memory = Path("memory.js").read_text(encoding="utf8")
          learning = Path("memory-learn.js").read_text(encoding="utf8")
          manager = Path("memory-manager.js").read_text(encoding="utf8")
          intent = Path("memory-intent.js").read_text(encoding="utf8")
          for forbidden in ["hjrmkkybhhwfelmatcga", "GEMINI_API_KEY", "SUPABASE_SERVICE_ROLE_KEY", "sb_secret_", "AIza"]:
              assert forbidden not in html and forbidden not in metier and forbidden not in preview and forbidden not in archives and forbidden not in memory and forbidden not in learning and forbidden not in intent and forbidden not in manager, "Référence interdite détectée"
          assert '<script src="./metier.js"></script>' in html
          assert '<script src="./transcript-preview.js"></script>' in html
          assert '<script src="./archive.js"></script>' in html
          assert '<script src="./memory.js"></script>' in html
          assert '<script src="./memory-learn.js"></script>' in html
          assert '<script src="./memory-manager.js"></script>' in html
          assert "angel-memory-manager-open" in manager
          assert "confirm_delete:'SUPPRIMER'" in manager
          assert "confirm_update:true" in manager
          assert "manager.init(" in html
          assert "manager.hide()" in html
          assert '<script src="./memory-intent.js"></script>' in html
          assert "setFinalUserHandler" in preview
          assert "AngelMemoryIntent" in learning
          assert "transcripts.setFinalUserHandler" in learning
          assert "learning.init({baseUrl:BASE_URL" in html
          assert "transcripts,onSaved:()=>manager.refresh()});" in html
          assert "AngelMemoryLearning.propose(args)" in metier
          assert "learning.init(" in html
          assert "confirmation:true" in learning
          assert "proposer_memoire" in metier
          assert "enregistrer_memoire" not in metier.split("const toolDefs=", 1)[1].split("const viewCSS=", 1)[0]
          assert 'memories.context()' in html
          assert 'angel-live-memory' in memory
          assert "const archiveReady=await archives.show()" in html
          assert "if(!archives.isReady())" in html
          assert "resolution=ignore-duplicates" in archives
          assert "Reprendre la dernière conversation" in archives
          assert "Reprendre cette conversation" in archives
          assert "angel-open-archives" in archives
          assert "details.open=true" in archives
          assert "afficher_conversations" in metier
          assert "openPicker()" in metier
          assert 'transcripts.turnComplete()' in html
          assert 'tools:[{functionDeclarations:metier.toolDefs}]' in html
          assert 'metier.toolCall(data.toolCall.functionCalls,{incidentMode})' in html
          assert "confirmer_devis" not in metier.split("const toolDefs=", 1)[1].split("const viewCSS=", 1)[0]
          tool_section = metier.split("const toolDefs=", 1)[1].split("const viewCSS=", 1)[0]
          for denied in ["confirmer_rendez_vous", "confirmer_deplacement_rendez_vous", "annuler_rendez_vous", "annuler_deplacement_rendez_vous"]:
              assert denied not in tool_section, "Mutation rendez-vous interdite aux outils vocaux : " + denied
          for required_tool in ["executer_plan_lecture", "preparer_rendez_vous", "preparer_deplacement_rendez_vous", "preparer_facture", "consulter_briefing", "rechercher_devis"]:
              assert ("{name:'" + required_tool + "'") in tool_section, "Outil prévu manquant : " + required_tool
          assert "La modification ne se fait qu'après clic sur Confirmer." in html
          assert "RÈGLE PRIORITAIRE DE LA DÉMO TEST" in html
          assert "correctDevisAfterRefusal" in html
          assert "recoverDevisRefusal" in metier
          assert "recoverBusinessVoice" in metier
          assert "correctBusinessAfterTurn" in html
          assert "preparer_deplacement_rendez_vous" in metier
          assert "Confirmer le déplacement fictif" in metier
          assert "Aucune facture créée" in metier
          s456 = Path("sprints456.js").read_text(encoding="utf8")
          assert '<script src="./sprints456.js"></script>' in html
          assert "extras.init(" in html
          assert "enregistrer_signalement_test" in s456
          assert "consulter_modules_test" in s456
          assert "URL.createObjectURL" in s456
          assert "isWakeName" in s456
          assert "isIncidentSpeech" in s456
          assert "RÈGLE PRIORITAIRE SIGNALEMENT CHANTIER" in html
          assert "options.incidentMode" in metier
          assert "confirmation:true" in s456
          assert "Dernier outil vocal" in metier
          assert "prepareLiveConnection" in html
          assert "Promise.all([micPromise,memoryPromise,tokenPromise])" in html
          assert "signal:controller.signal" in html
          assert "startupAbort.abort()" in html
          assert "MAX_STARTUP_AUDIO_MS=20000" in html
          assert "enqueuePendingAudio" in html
          assert "flushPendingAudio" in html
          assert "Micro actif — parle maintenant" in html
          assert "preconnect" in html
          assert "Lister tous mes devis TEST" in metier
          assert len(js) > 2500
          Path("/tmp/angel-v2-client.js").write_text(js, encoding="utf8")
          PY
      - name: Bloquer toute régression et publier uniquement après succès
        run: |
          node --check /tmp/angel-v2-client.js
          node --check metier.js
          node --check sprints456.js
          node --check transcript-preview.js
          node --check archive.js
          node --check memory.js
          node --check memory-learn.js
          node --check memory-manager.js
          node --check memory-intent.js
          node --check auto-memory.js
          node memory-intent.test.cjs
          node auto-memory.test.cjs
          node memory-ui.test.cjs
          node memory-manager.test.cjs
          node devis-voice-guard.test.cjs
          node metier-voice-sprints-567.test.cjs
          node sprints456.test.cjs
          node incident-wake-routing.test.cjs
          node live-startup-performance.test.cjs
          node instant-micro-buffer.test.cjs
          node scripts/quality-gate.cjs
