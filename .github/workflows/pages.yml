name: Déployer la vitrine Ángel V2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les fichiers publics
        uses: actions/checkout@v4
      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Préparer les fichiers statiques
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
